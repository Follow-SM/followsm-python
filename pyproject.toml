[build-system]
requires = ["flit_core>=3.9,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "followsm-sdk"
version = "1.5.1"
description = "Official Python SDK for the FollowSM smart-money & orderbook toxicity API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "pydantic>=2.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-mock>=3.12"]

[project.urls]
Homepage = "https://follow-sm.com"
Documentation = "https://follow-sm.com/docs"
